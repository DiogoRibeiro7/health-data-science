repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: lintr
        name: lintr
        entry: Rscript -e 'lints <- lintr::lint_dir(); print(lints); if (length(lints) > 0) quit(status = 1)'
        language: system
        files: "\\.(R|r)$"
