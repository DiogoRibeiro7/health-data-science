name: Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  full-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: [release, oldrel-1]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: ${{ matrix.r-version }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
            any::testthat
            any::lintr
            any::covr
          needs: check

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run linters
        run: pre-commit run --all-files

      - name: Validate release surface
        run: Rscript scripts/check_release_surface.R

      - name: Run R CMD check
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        run: |
          R CMD build .
          R CMD check healthdatascience_*.tar.gz --no-manual --as-cran

      - name: Enforce test coverage
        if: matrix.r-version == 'release'
        run: >-
          Rscript -e 'cov <- covr::package_coverage();
            print(cov);
            coverage <- covr::percent_coverage(cov);
            message(sprintf("Coverage: %.2f%%", coverage));
            if (coverage < 80) stop("coverage below 80%")'

  security:
    runs-on: ubuntu-latest
    needs: full-check
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t health-data-science:latest .

      - uses: aquasecurity/trivy-action@v0.13.0
        with:
          image-ref: health-data-science:latest
          format: table
          exit-code: '1'
          vuln-type: os,library
