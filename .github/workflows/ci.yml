name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: release

      - name: Parse changed R files
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only               "${{ github.event.pull_request.base.sha }}"               "${{ github.sha }}" -- '*.R' '*.r'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed R files."
            exit 0
          fi

          printf '%s\n' "${files[@]}"
          Rscript - "${files[@]}" <<'RSCRIPT'
          files <- commandArgs(trailingOnly = TRUE)
          failures <- 0L

          for (file in files) {
            tryCatch(
              parse(file = file),
              error = function(e) {
                message(file, ": parse failure: ", conditionMessage(e))
                failures <<- failures + 1L
              }
            )
          }

          if (failures > 0L) quit(status = 1L)
          RSCRIPT

      - name: Check changed text
        shell: bash
        run: |
          git diff --check             "${{ github.event.pull_request.base.sha }}"             "${{ github.sha }}"

  full-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: [release, oldrel-1]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: ${{ matrix.r-version }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::lintr
            any::covr
          needs: check

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run linters
        shell: bash
        run: |
          pre-commit run             --from-ref "${{ github.event.before }}"             --to-ref "${{ github.sha }}"

      - name: Run R CMD check
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        run: |
          R CMD build .
          R CMD check healthdatascience_*.tar.gz --no-manual --as-cran

      - name: Enforce test coverage
        if: matrix.r-version == 'release'
        run: >-
          Rscript -e 'cov <- covr::package_coverage();
            print(cov);
            coverage <- covr::percent_coverage(cov);
            message(sprintf("Coverage: %.2f%%", coverage));
            if (coverage < 80) stop("coverage below 80%")'

  security:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: full-check
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t health-data-science:latest .

      - uses: aquasecurity/trivy-action@v0.13.0
        with:
          image-ref: health-data-science:latest
          format: table
          exit-code: '1'
          vuln-type: os,library
