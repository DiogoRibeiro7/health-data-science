name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: release

      - name: Parse package R files
        shell: bash
        run: |
          mapfile -t files < <(find R -type f \( -name '*.R' -o -name '*.r' \) | sort)

          printf '%s\n' "${files[@]}"
          Rscript - "${files[@]}" <<'RSCRIPT'
          files <- commandArgs(trailingOnly = TRUE)
          failures <- 0L

          for (file in files) {
            tryCatch(
              parse(file = file),
              error = function(e) {
                message(file, ": parse failure: ", conditionMessage(e))
                failures <<- failures + 1L
              }
            )
          }

          if (failures > 0L) quit(status = 1L)
          RSCRIPT

      - name: Check changed text
        shell: bash
        run: |
          git diff --check \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}"

  main-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'

      - name: Build core package
        run: R CMD build --no-build-vignettes .

      - name: Install core package
        run: R CMD INSTALL healthdatascience_*.tar.gz

      - name: Load core package
        run: Rscript -e 'library(healthdatascience); packageVersion("healthdatascience")'
